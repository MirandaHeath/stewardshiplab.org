version = 1

[[annotations]]
path = [
    ".gitignore",
    "REUSE.toml",
    "astro.config.mjs",
    "eslint.config.mjs",
    "package.json",
    "pnpm-lock.yaml",
    "pnpm-workspace.yaml",
    "public/funding.json",
    "public/robots.txt",
    "src/data/**",
    "statichost.yml",
    "tsconfig.json",
]
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [
    "src/components/**",
    "src/content.config.ts",
    "src/layouts/**",
    "src/pages/**",
    "src/scripts/**",
    "src/styles/**",
    "src/utils/**",
]
SPDX-FileCopyrightText = "© Software Stewardship Lab"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
    "src/assets/images/icons/phosphor/**",
]
SPDX-FileCopyrightText = "© Phosphor Icons"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
    "CONTRIBUTING.md",
    "README.md",
    "public/*.pdf",
    "public/images/reflections*",
]
SPDX-FileCopyrightText = "© Software Stewardship Lab"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = [
    "src/content/**/*",
]
SPDX-FileCopyrightText = "© The post's author"
SPDX-License-Identifier = "LicenseRef-Restricted"

[[annotations]]
path = [
    "public/images/people/*",
]
SPDX-FileCopyrightText = "© The subject"
SPDX-License-Identifier = "LicenseRef-Restricted"

[[annotations]]
path = [
    "public/brand/**",
    "public/images/favicon.png",
    "public/images/logo.svg",
    "public/images/og/**",
    "public/images/star-for-bg.svg",
    "public/images/vlad-squiggle-sig.svg",
    "src/assets/images/logo.svg",
    "src/assets/images/markset.svg",
    "src/assets/images/star.svg",
]
SPDX-FileCopyrightText = "© Software Stewardship Lab"
SPDX-License-Identifier = "LicenseRef-Restricted"

[[annotations]]
path = [
    "public/fonts/montreuil/**",
]
SPDX-FileCopyrightText = "© OH no Type Co"
SPDX-License-Identifier = "LicenseRef-Restricted"

[[annotations]]
path = [
    "public/fonts/valkyrie/**",
]
SPDX-FileCopyrightText = "© Matthew Butterick"
SPDX-License-Identifier = "LicenseRef-Restricted"
